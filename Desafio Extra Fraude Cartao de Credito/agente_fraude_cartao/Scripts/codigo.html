    // parse header + rows
    const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length>0);
    const header = lines[0].split(/\s+/);
    const rows = lines.slice(1);

    // prepare columns dict
    const cols = {};
    header.forEach(h => cols[h] = []);

    rows.forEach((r, idx) => {
      const parts = r.split(/\s+/);
      // keep only as many parts as header (em casos de excesso, truncar)
      if(parts.length >= header.length){
        for(let i=0;i<header.length;i++) cols[header[i]].push(parseFloat(parts[i]));
      }
      // se faltar, ignorar a linha (não acontece na amostra)
    });

    // --- TABELA de amostra (primeiras 15 linhas) com formatação condicional ---
    function makeTableHTML(nrows=15){
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const hrow = document.createElement('tr');
      header.forEach(h => { const th = document.createElement('th'); th.textContent = h; hrow.appendChild(th); });
      thead.appendChild(hrow); table.appendChild(thead);
      const tb = document.createElement('tbody');

      for(let r=0; r<Math.min(nrows, rows.length); r++){
        const tr = document.createElement('tr');
        for(let c=0;c<header.length;c++){
          const h = header[c];
          const td = document.createElement('td');
          const val = cols[h][r];
          // formatação condicional: Amount e Class
          if(h === 'Amount'){
            if(val > 200) td.className='high';
            else if(val < 5) td.className='low';
            else td.className='mid';
          }
          if(h === 'Class'){
            // Class: fraude = 1 (vermelho), normal = 0 (verde)
            td.className = (val === 1) ? 'high' : 'low';
          }
          td.textContent = Number.isFinite(val) ? val.toString() : '';
          tr.appendChild(td);
        }
        tb.appendChild(tr);
      }
      table.appendChild(tb);
      return table;
    }

    document.getElementById('table-container').appendChild(makeTableHTML(15));

    // --- GRÁFICOS PRINCIPAIS ---
    // Amount
    const traceAmount = { x: cols['Amount'], type:'histogram', marker:{color:'rgba(231,76,60,0.8)'}, opacity:0.9 };
    const layoutAmount = { title:'Histograma - Amount', xaxis:{title:'Amount (valor da transação)'}, yaxis:{title:'Frequência (contagem)'} };
    Plotly.newPlot('plot_amount', [traceAmount], layoutAmount, {displayModeBar:false});

    // Time
    const traceTime = { x: cols['Time'], type:'histogram', marker:{color:'rgba(52,152,219,0.8)'} };
    const layoutTime = { title:'Histograma - Time', xaxis:{title:'Time (s desde 1ª transação)'}, yaxis:{title:'Frequência'} };
    Plotly.newPlot('plot_time', [traceTime], layoutTime, {displayModeBar:false});

    // Class (contagem)
    const classCounts = cols['Class'].reduce((acc,v)=>{ acc[v] = (acc[v]||0)+1; return acc; }, {});
    const traceClass = { x: Object.keys(classCounts), y: Object.values(classCounts), type:'bar', marker:{color:['#27ae60','#c0392b']} };
    const layoutClass = { title:'Contagem por Class (0 = normal, 1 = fraude)', xaxis:{title:'Class'}, yaxis:{title:'Contagem'} };
    Plotly.newPlot('plot_class', [traceClass], layoutClass, {displayModeBar:false});

    // Histograms para todas as variáveis que começam com V (pequenas)
    const vNames = header.filter(h => /^V/i.test(h));
    const vplots = document.getElementById('vplots');
    vNames.forEach(v => {
      const div = document.createElement('div'); div.className='plot-small'; div.id = 'plot_' + v; vplots.appendChild(div);
      const tr = { x: cols[v], type:'histogram', marker:{color:'rgba(31,119,180,0.8)'} };
      const layout = { title:v, margin:{t:30,l:30,r:10,b:30}, xaxis:{title:v, automargin:true}, yaxis:{title:'Freq'} };
      Plotly.newPlot(div.id, [tr], layout, {displayModeBar:false});
    });

    // --- Impressão de resumo simulado no console (simula o carregamento do HTML) ---
    function stats(arr){
      const n = arr.length; const s = arr.reduce((a,b)=>a+(Number(b)||0),0); const mean = s/n; const min = Math.min.apply(null, arr); const max = Math.max.apply(null, arr);
      return {n, mean: Number(mean.toFixed(4)), min, max};
    }

    console.log('Simulação de carregamento: amostra extraída do CONTEXTO');
    console.log('Linhas (amostra):', rows.length);
    console.log('Amount:', stats(cols['Amount']));
    console.log('Time:', stats(cols['Time']));
    console.log('Class counts:', classCounts);
    vNames.forEach(v => console.log(v, 'n=', cols[v].length, 'mean~', (cols[v].reduce((a,b)=>a+b,0)/cols[v].length).toFixed(4)));
