name: Build EXE with Nuitka

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc g++ clang zlib1g-dev patchelf tesseract-ocr poppler-utils
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install -r "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts/requirements_linux.txt" || echo "No requirements.txt"

    - name: Build binary with Nuitka
      run: |
        cd "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts"
        nuitka --onefile --enable-plugin=no-qt --output-dir=output agente_nfs.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: executable
        path: "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts/output/agente_nfs"
