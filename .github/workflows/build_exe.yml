name: Build EXE on Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts/requirements.txt" || echo "No requirements.txt"

    - name: Build .exe
      run: |
        pyinstaller --onefile "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts/agente_nfs.py"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: executable
        path: dist/agente_nfs.exe