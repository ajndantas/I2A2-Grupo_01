O ChatGPT disse:
Aqui está a versão equivalente do seu workflow .yml usando Nuitka em vez de PyInstaller para compilar o executável:

name: Build EXE on Windows with Nuitka

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install -r "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts/requirements.txt" || echo "No requirements.txt"

    - name: Build .exe with Nuitka
      run: |
        cd "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts"
        nuitka --onefile --windows-disable-console --output-dir=output agente_nfs.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: executable
        path: "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts/output/agente_nfs.exe"
