name: GHCR Docker Image & Cloud Run Deploy agente_chatbotseguro

on:
  push:
    branches: [ "master" ]
    paths: 
      - 'Insurminds/Desafio 2/agente_chatbotseguro/**'        

env:
  PROJECT_ID: n8n-meus-ensinamentos   # Substitua pelo ID do seu projeto no GCP
  PORT: 8002                          # Porta onde a aplicação vai rodar dentro do container. 
                                      # que é a porta padrão de entrada do Cloud Run. 
  REGION: us-central1                 # Região do GCP (ex: São Paulo ou us-central1)
  SERVICE_NAME: agente-chatbotseguro  # Nome que o serviço terá no Cloud Run
  API_KEY_OPENROUTER: ${{ secrets.API_KEY_OPENROUTER }} # DEFINA SUA API KEY AQUI, ELA VAI SER USADA PARA AUTENTICAR AS REQUISIÇÕES AO SERVIÇO PYTHON
  API_KEY: ${{ secrets.API_KEY }} # DEFINA SUA API KEY AQUI, ELA VAI SER USADA PARA AUTENTICAR AS REQUISIÇÕES AO SERVIÇO PYTHON
  # github.repository_owner = ajndantas. Variável nativa do GitHub Actions que retorna o nome do dono do repositório, usada para construir o caminho da imagem no GHCR.
  IMAGE_ID: ghcr.io/${{ github.repository_owner }}/agente_chatbotseguro # Imagem que será publicada no GitHub Container Registry (GHCR)
  
jobs:

  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Build e Push da imagem Docker para o GHCR
      #
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push the Docker image
        run: |
          TAG=latest # Tag da imagem Docker, pode ser "latest" ou uma tag específica como "v1.0" ou data/hora para versionamento. TAG=$(date +%Y%m%d%H%M%S)

          docker build --build-arg API_KEY_OPENROUTER=${{ env.API_KEY_OPENROUTER }} --build-arg API_KEY=${{ env.API_KEY }} -t ${{ env.IMAGE_ID }}:$TAG "Insurminds/Desafio 2/agente_chatbotseguro/Scripts/" # PEGA O DOCKERFILE AQUI
          docker push ${{ env.IMAGE_ID }}:$TAG

      # 2. Autenticar no Google Cloud via Service Account
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Crie esse Secret no GitHub com o JSON da sua Service Account

      # 3. Configurar o gcloud CLI no runner
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Deploy da imagem Docker para o Cloud Run
      #
      # O repositório do GHCR é público.
      # 
      # ⚠️ Nota importante de segurança: Para que o Cloud Run consiga puxar a imagem diretamente do seu repositório privado no GHCR, 
      # a Service Account do GCP usada no deploy precisa ter permissão de leitura no seu pacote do GitHub, ou você precisará configurar 
      # uma credencial de repositório no Cloud Run. Se o seu repositório/pacote no GHCR for público, o Cloud Run puxará a imagem sem problemas.
      #      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --port=${{ env.PORT }} \
            --image="${{ env.IMAGE_ID }}:$TAG" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=API_KEY_OPENROUTER=${{ env.API_KEY_OPENROUTER }},API_KEY=${{ env.API_KEY }} \
            --memory=1Gi

     
      