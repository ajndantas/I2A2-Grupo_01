name: Docker Image CI agente_nfs

on:
  push:
    branches: [ "master" ]
    paths: 
      - 'Desafio 2 - Projeto - 11062025/agente_nfs/**'        

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the Docker image
        run: |
          # github.repository_owner = ajndantas
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/agente_nfe
          #IMAGE_ID=agente_nfe
          #TAG=$(date +%Y%m%d%H%M%S)
          TAG=latest
          docker build --build-arg API_KEY="${{ secrets.API_KEY }}" -t $IMAGE_ID:$TAG "Desafio 2 - Projeto - 11062025/agente_nfs/Scripts/" # PEGA O DOCKERFILE AQUI
          docker push $IMAGE_ID:$TAG

      - name: Executar comandos via SSH na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          debug: true
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: API_KEY, API_KEY_OPENROUTER # EXPORTA A VARIÁVEL DE AMBIENTE
          script: |
            # Exporte a variável para que o Docker Compose consiga visualizá-la
            export API_KEY=$API_KEY
            export API_KEY_OPENROUTER=$API_KEY_OPENROUTER

            echo "Entrando no diretório do projeto"
            cd ~/agentes

            echo "Parando container"
            docker compose down agente_nfe nginx_ia # PARA PARAR O NGINX TAMBÉM, POIS ELE DEPENDE DO AGENTE E PRECISA SER REINICIADO PARA PEGAR AS ATUALIZAÇÕES

            echo "Removendo imagem antiga"
            docker image rm -f ghcr.io/ajndantas/agente_nfe:latest || true

            echo "Subindo container atualizado"
            docker compose up -d agente_nfe nginx_ia # SOBE O NGINX TAMBÉM, POIS ELE DEPENDE DO AGENTE E PRECISA SER REINICIADO PARA PEGAR AS ATUALIZAÇÕES

            echo "Deploy finalizado com sucesso"    